# Confere uma vez por dia se as coletas na VPS estao andando. Falha (e o
# GitHub manda e-mail) quando a ultima coleta de precos ou de noticias tem
# mais de 3 horas. Le pela API publica do site, sem chave: as tabelas
# coletas e fontes sao abertas para leitura.
name: Coletas na VPS

on:
  schedule:
    - cron: "47 11 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  conferir:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      API_URL: https://spkids-api.afonsolelis.tech
    steps:
      - name: Última coleta
        run: |
          set -euo pipefail
          resposta="$(curl -sS --fail-with-body --retry 3 --retry-all-errors \
            "$API_URL/coletas?select=momento,origem,cartas,com_preco&origem=neq.importado&order=momento.desc&limit=1")"
          echo "$resposta"
          momento="$(echo "$resposta" | jq -r '.[0].momento // empty')"
          [ -n "$momento" ] || { echo "::error::nenhuma coleta no banco"; exit 1; }
          idade=$(( $(date +%s) - $(date -d "$momento" +%s) ))
          echo "última coleta há $(( idade / 60 )) minutos"
          if [ "$idade" -gt 10800 ]; then
            echo "::error::a última coleta foi há mais de 3 horas; ver cron.job_run_details no banco (scripts/analisar_push.sh)"
            exit 1
          fi

      - name: Última coleta de notícias
        run: |
          set -euo pipefail
          resposta="$(curl -sS --fail-with-body --retry 3 --retry-all-errors \
            "$API_URL/fontes?select=ok_em&ok_em=not.is.null&order=ok_em.desc&limit=1")"
          echo "$resposta"
          momento="$(echo "$resposta" | jq -r '.[0].ok_em // empty')"
          [ -n "$momento" ] || { echo "::error::nenhuma coleta de notícias no banco"; exit 1; }
          idade=$(( $(date +%s) - $(date -d "$momento" +%s) ))
          echo "última coleta de notícias há $(( idade / 60 )) minutos"
          if [ "$idade" -gt 10800 ]; then
            echo "::error::a última coleta de notícias foi há mais de 3 horas; ver cron.job_run_details no banco"
            exit 1
          fi
