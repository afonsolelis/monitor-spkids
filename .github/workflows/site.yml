# O site saiu do GitHub Pages: mora na VPS da Hostinger (hostinger/), e o
# Coolify reconstroi as duas paginas a cada push na main, por webhook do
# GitHub. Aqui so fica um redirecionamento no endereco antigo, para link
# salvo continuar funcionando. Roda quando este arquivo muda ou a mao.
name: Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/site.yml]

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NOVO: https://spkids.afonsolelis.tech

jobs:
  redirecionar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Páginas de redirecionamento
        run: |
          set -euo pipefail
          mkdir site
          for par in "index.html:/" "precos.html:/precos.html"; do
            destino="${NOVO}${par#*:}"
            cat > "site/${par%%:*}" <<HTML
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=${destino}">
          <link rel="canonical" href="${destino}">
          <title>Mudou de endereço</title>
          </head>
          <body>
          <p>O site mudou para <a href="${destino}">${destino}</a>.</p>
          </body>
          </html>
          HTML
          done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
