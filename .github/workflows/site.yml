# Publica o site no GitHub Pages: index.html (noticias) na raiz e o painel de
# precos das cartas como precos.html. As duas paginas sao so a casca: os dados
# vem do Supabase quando alguem abre, e as coletas rodam no pg_cron do proprio
# Supabase (supabase/noticias.sql e supabase/coleta_precos.sql).
name: Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, painel_precos.html, .github/workflows/site.yml]

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: mkdir site && cp index.html site/ && cp painel_precos.html site/precos.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
