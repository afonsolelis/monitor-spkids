# Coleta o preco das cartas de hora em hora, grava o CSV no repositorio e
# publica o painel no GitHub Pages. Substitui o cron local de precos.
name: Painel de preços

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [painel_precos.html, precos_cartas.py, .github/workflows/painel.yml]

concurrency:
  group: painel
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/Sao_Paulo
      POKEWALLET_KEY: ${{ secrets.POKEWALLET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python precos_cartas.py

      - name: Grava o CSV no repositório
        run: |
          git diff --quiet -- dados/precos-cartas.csv && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/precos-cartas.csv
          git commit -m "Coleta de preços $(date '+%d/%m/%Y %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main

      - run: mkdir site && cp dados/precos-cartas.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
