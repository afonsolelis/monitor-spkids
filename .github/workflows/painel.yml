# Publica o painel no GitHub Pages. E so a casca: os precos vem do Supabase
# quando alguem abre a pagina, e a coleta roda no pg_cron do proprio Supabase
# (supabase/coleta_precos.sql).
name: Painel de preços

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [painel_precos.html, .github/workflows/painel.yml]

concurrency:
  group: painel
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - run: mkdir site && cp painel_precos.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
