# As paginas sao a casca: leem da API ao abrir. Sem cache no navegador, para
# um push na main aparecer na hora.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/html text/css application/javascript;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    # As paginas so tem script e estilo inline (sem innerHTML), leem das duas
    # APIs e mostram imagem https dos feeds e da PokeWallet. Fora disso, nada:
    # script de terceiro injetado nao roda nem manda dado para fora.
    add_header Content-Security-Policy "default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: data:; connect-src https://spkids-api.afonsolelis.tech https://resultadomega.com.br; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /painel_precos.html { return 301 /precos.html; }
    location / { try_files $uri $uri/ =404; }
}
