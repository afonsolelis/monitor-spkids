# As paginas sao a casca: leem da API ao abrir. Sem cache no navegador, para
# um push na main aparecer na hora.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/html text/css application/javascript;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    location = /painel_precos.html { return 301 /precos.html; }
    location / { try_files $uri $uri/ =404; }
}
